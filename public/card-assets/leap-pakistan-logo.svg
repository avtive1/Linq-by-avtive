<svg width="240" height="70" viewBox="0 0 240 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LEAP text group -->
  <g transform="translate(10, 10)">
    <!-- 'LE' in Lavender/Purple -->
    <text x="0" y="32" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#9353D3" letter-spacing="1px">LE</text>
    
    <!-- Stylized 'A' with orange diagonal stroke -->
    <g transform="translate(48, 0)">
      <!-- Left leg of A in White -->
      <path d="M4 32 L14 4 L19 4 L14 32 Z" fill="#FFFFFF"/>
      <!-- Right leg / slice of A in Bright Orange -->
      <path d="M12 4 L26 32 L21 32 L15 16 Z" fill="#FF7900"/>
      <!-- Crossbar in Orange -->
      <path d="M8 22 L20 22 L19 18 L10 18 Z" fill="#FF7900"/>
    </g>

    <!-- 'P' in White -->
    <text x="78" y="32" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" letter-spacing="1px">P</text>
    
    <!-- "— PAKISTAN —" subtext -->
    <line x1="0" y1="44" x2="24" y2="44" stroke="#FF7900" stroke-width="1.5"/>
    <text x="32" y="47" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FF7900" letter-spacing="2px">PAKISTAN</text>
    <line x1="90" y1="44" x2="114" y2="44" stroke="#FF7900" stroke-width="1.5"/>
  </g>
</svg>
