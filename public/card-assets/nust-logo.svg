  </g>
  <!-- NUST Typography in pure white -->
  <text x="42" y="27" font-family="Inter, -apple-system, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="0.5px">NUST</text>
  <!-- Subtitle in pure white -->
  <text x="43" y="41" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" letter-spacing="0.2px">Sector H-12, Islamabad</text>
