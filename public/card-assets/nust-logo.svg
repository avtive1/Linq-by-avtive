<svg width="170" height="48" viewBox="0 0 170 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- NUST Emblem -->
  <g transform="translate(18, 24)">
    <!-- Outer Shield / Circle -->
    <circle cx="0" cy="0" r="14" fill="#0A3E94" stroke="#00C0F0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10" fill="#061838" />
    <!-- Stylized Book & Stars -->
    <path d="M -5,3 Q 0,0 5,3 L 5,-4 Q 0,-6 -5,-4 Z" fill="#00E676" />
