name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # Warnings only (e.g. next/image suggestions); errors fail the job.
      - name: Lint
        run: npm run lint

      - name: Unit and edge-case tests
        run: npm run test:edge

      - name: Audit (moderate and above)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Required for NextAuth during `next build` prerender (NODE_ENV=production).
          NEXTAUTH_SECRET: ci-build-placeholder-not-used-in-production
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
