name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CI placeholders only; production runtime uses real deployment secrets.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      RUN_DB_INTEGRATION_TESTS: "false"
      NEON_AUTH_BASE_URL: https://ci-build-placeholder.neon-auth.invalid
      NEON_AUTH_COOKIE_SECRET: ci-build-placeholder-neon-auth-cookie-secret-minimum-32-chars

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Warnings only (e.g. next/image suggestions); errors fail the job.
      - name: Lint
        run: npm run lint

      - name: Test suite
        run: npm run test

      - name: Audit (moderate and above)
        run: npm audit --audit-level=moderate
        # Known upstream advisories remain visible but do not block validation.
        continue-on-error: true

      - name: Build
        run: npm run build
